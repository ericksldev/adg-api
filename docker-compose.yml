# Stack API + Postgres. Run from this directory: `docker compose up`
# Configuration: copy `.env.example` to `.env` (Compose loads `.env` for ${VAR} below).
#
# PostgreSQL: the API user (DB_USER) must be allowed to CREATE DATABASE for per-company tenant DBs.

name: vrete-api

services:
  postgres:
    image: postgres:15
    container_name: vrete-api-postgres
    restart: "no"
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrete-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT}:3010"
      - "${NODE_DEBUG_HOST_PORT}:9230"
    environment:
      NODE_ENV: development
      PORT: ${PORT}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TENANT_POOL_MAX: ${TENANT_POOL_MAX}
      DB_SYNC_ALTER: ${DB_SYNC_ALTER}
      SEED_SAAS_OWNER_ENABLED: ${SEED_SAAS_OWNER_ENABLED}
      SEED_SAAS_COMPANY_NAME: ${SEED_SAAS_COMPANY_NAME}
      SEED_SAAS_OWNER_EMAIL: ${SEED_SAAS_OWNER_EMAIL}
      SEED_SAAS_OWNER_USERNAME: ${SEED_SAAS_OWNER_USERNAME}
      SEED_SAAS_OWNER_PASSWORD: ${SEED_SAAS_OWNER_PASSWORD}
      SEED_SAAS_OWNER_FIRST_NAME: ${SEED_SAAS_OWNER_FIRST_NAME}
      SEED_SAAS_OWNER_LAST_NAME: ${SEED_SAAS_OWNER_LAST_NAME}
      SEED_SAAS_OWNER_ID_CARD: ${SEED_SAAS_OWNER_ID_CARD}
    command: npm run dev:debug
    volumes:
      - .:/app
      - vrete_api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DOCKER_VOLUME}
  vrete_api_node_modules:
    # Existing volume. The Docker volume rename is deferred.
    external: true
    name: adg-api_adg_api_node_modules
